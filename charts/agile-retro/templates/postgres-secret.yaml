{{- if and .Values.postgresql.enabled (not .Values.sqlite.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agile-retro.fullname" . }}-postgres
  labels:
    {{- include "agile-retro.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    # Kept by `helm uninstall`: the password must outlive a reinstall,
    # or the kept volume's data could not be opened by the new release.
    helm.sh/resource-policy: keep
type: Opaque
{{- /*
  No connection string here: the app builds one from PGHOST, PGUSER,
  PGPASSWORD and PGDATABASE (db/database-url.cjs), so the password is read
  from wherever it is kept — this Secret, or postgresql.auth.existingSecret.
*/}}
stringData:
  postgres-user: {{ .Values.postgresql.auth.username | quote }}
  postgres-database: {{ .Values.postgresql.auth.database | quote }}
  {{- if not .Values.postgresql.auth.existingSecret }}
  {{- /*
    The password is generated on install and kept on upgrade: rendering a new
    one would change what the app connects with while the database still holds
    the old password, and every request would fail authentication.
  */}}
  postgres-password: {{ include "agile-retro.secretValue" (dict "ctx" $ "value" .Values.postgresql.auth.password "key" "postgres-password" "length" 32 "secret" (printf "%s-postgres" (include "agile-retro.fullname" .))) | quote }}
  {{- end }}
{{- end }}
