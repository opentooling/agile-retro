{{- if and .Values.postgresql.enabled (not .Values.sqlite.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agile-retro.fullname" . }}-postgres
  labels:
    {{- include "agile-retro.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
{{- /*
  The password is generated on install and kept on upgrade: rendering a new
  one would change the app's connection string while the database still holds
  the old password, and every request would fail authentication.
*/}}
{{- $password := include "agile-retro.secretValue" (dict "ctx" $ "value" .Values.postgresql.auth.password "key" "postgres-password" "length" 32 "secret" (printf "%s-postgres" (include "agile-retro.fullname" .))) }}
stringData:
  postgres-user: {{ .Values.postgresql.auth.username | quote }}
  postgres-password: {{ $password | quote }}
  postgres-database: {{ .Values.postgresql.auth.database | quote }}
  # Connection string the app reads as DATABASE_URL. The password is
  # percent-encoded: a generated one is alphanumeric, but a configured one may
  # hold characters that would otherwise end the userinfo part of the URL.
  database-url: "postgres://{{ .Values.postgresql.auth.username }}:{{ $password | urlquery }}@{{ include "agile-retro.fullname" . }}-postgres:5432/{{ .Values.postgresql.auth.database }}"
{{- end }}
