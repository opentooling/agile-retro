{{- if not .Values.secrets.existingSecret }}
{{- /*
The release's own Secret.

Values left empty are generated once and then kept: the templates read back
what this Secret already holds (see agile-retro.secretValue), so an upgrade
never rotates AUTH_SECRET — which would sign every session cookie out — or a
password out from under a running PostgreSQL.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" (include "agile-retro.fullname" .) }}
  labels:
    {{- include "agile-retro.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth-secret: {{ include "agile-retro.secretValue" (dict "ctx" $ "value" .Values.auth.secret "key" "auth-secret" "length" 48) | quote }}
  {{- if and .Values.auth.keycloak.enabled (not .Values.auth.keycloak.existingSecret) }}
  keycloak-client-secret: {{ .Values.auth.keycloak.clientSecret | quote }}
  {{- end }}
  {{- if and .Values.auth.keycloak.adminClientSecret (not .Values.auth.keycloak.adminExistingSecret) }}
  keycloak-admin-client-secret: {{ .Values.auth.keycloak.adminClientSecret | quote }}
  {{- end }}
  {{- if and .Values.auth.google.enabled (not .Values.auth.google.existingSecret) }}
  google-client-secret: {{ .Values.auth.google.clientSecret | quote }}
  {{- end }}
{{- end }}
