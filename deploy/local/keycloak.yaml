# Local Keycloak for deploy/local/deploy.sh: dev mode, in-memory, with the
# realm in keycloak-realm.json (deploy.sh turns it into the keycloak-realm
# ConfigMap, and the deployed end-to-end tests read their users from it).
# Convenience only — production points auth.keycloak.issuer at a real Keycloak.
#
# The issuer has to be the same URL for the browser and for the app's pods,
# because Keycloak writes it into every token and the app compares it. The
# browser reaches http://auth.localhost:8089 through the k3d load balancer
# (*.localhost resolves to loopback in browsers and the OS, with no DNS lookup
# a corporate resolver could block, as some do for localtest.me);
# the app pod reaches the very same URL through a hostAliases entry pointing at
# this Service, which therefore listens on 8089 too. KC_HOSTNAME pins the URL
# so Keycloak never derives a different one from a request.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: { app: keycloak }
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm", "--http-port=8080"]
          env:
            - name: KC_HOSTNAME
              value: http://auth.localhost:8089
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /realms/retro, port: http }
            periodSeconds: 5
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: { app: keycloak }
  ports:
    # 8089, like the browser's URL, so the app pod can use the issuer as-is.
    - name: http
      port: 8089
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
spec:
  rules:
    - host: auth.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: keycloak, port: { number: 8089 } }
