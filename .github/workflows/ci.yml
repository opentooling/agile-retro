name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'server.ts'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - '*.ts'
      - '*.js'
      - '*.mjs'
      - '*.json'
      # Migrations ship in the image: a commit that only adds one must still
      # build and publish an image that contains it.
      - 'db/**'
      # What the test and chart jobs run against.
      - 'e2e/**'
      - 'e2e-deployed/**'
      - 'deploy/**'
      - '.trivyignore'
      - '.audit-exceptions.json'
      - '.github/workflows/ci.yml'
      - 'charts/**'
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, so newly published advisories against unchanged dependencies are
    # found without waiting for the next commit.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes the older run pointless. On main every
# commit keeps its own result, so a red build can be traced to the commit that
# caused it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/opentooling/agile-retro
  CHART_REGISTRY: oci://ghcr.io/opentooling/charts
  HELM_VERSION: v3.22.0

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

  e2e:
    name: End-to-end Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Starts the real server against a throwaway SQLite database and drives it
      # in a browser as three seeded users. See playwright.config.ts.
      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  chart:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint with the defaults and with the CI values
        run: |
          helm lint charts/agile-retro
          helm lint charts/agile-retro -f charts/agile-retro/ci/openshift-values.yaml
          helm lint charts/agile-retro -f charts/agile-retro/ci/extra-objects-values.yaml

      # extraObjects is a feature, so it is proven to render rather than
      # assumed: once as a YAML object and once as a templated string, each
      # resolving the release's own helpers.
      - name: Render extraObjects
        run: |
          helm template ci charts/agile-retro -n ci \
            -f charts/agile-retro/ci/extra-objects-values.yaml > rendered.yaml
          grep -q "agile-retro-ci-object" rendered.yaml
          grep -q "agile-retro-ci-string" rendered.yaml
          grep -qE "namespace: '?ci'?" rendered.yaml
          grep -q 'rendered: "yes"' rendered.yaml
          # Conditional items, as in LogGate: rendered when the condition
          # holds — a flag set, true, or no condition at all — and only then.
          grep -q 'agile-retro-ci-flag-on' rendered.yaml
          grep -q 'agile-retro-ci-string-on' rendered.yaml
          grep -q 'agile-retro-ci-no-when' rendered.yaml
          grep -q 'agile-retro-ci-dig-on' rendered.yaml
          if grep -e 'ci-flag-off' -e 'ci-flag-missing' -e 'ci-string-off' -e 'ci-dig-absent' rendered.yaml; then
            echo "::error::a conditional extraObjects item rendered with its condition off"; exit 1
          fi
          echo "Both extraObjects forms rendered, conditional ones only when enabled.

      # The locked-down install, held to what it promises: a Route with a
      # timeout long enough for a board's WebSocket, no Ingress, no fixed IDs
      # for restricted-v2 to reject, the private CA mounted where Node reads
      # it, and DNS allowed to OpenShift's own resolver.
      - name: Render the OpenShift example
        run: |
          helm template agile-retro charts/agile-retro -n retro \
            -f charts/agile-retro/ci/openshift-values.yaml > openshift.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("openshift.yaml")) if d]
          kinds = {d["kind"] for d in docs}
          assert "Ingress" not in kinds, kinds
          route = next(d for d in docs if d["kind"] == "Route")
          assert route["metadata"]["annotations"]["haproxy.router.openshift.io/timeout"] == "1h", route
          for d in docs:
              spec = d.get("spec", {})
              pod = spec if d["kind"] == "Pod" else spec.get("template", {}).get("spec")
              if pod:
                  fixed = {"runAsUser", "runAsGroup", "fsGroup"} & set(pod.get("securityContext", {}))
                  assert not fixed, (d["kind"], d["metadata"]["name"], fixed)
                  for c in pod.get("initContainers", []) + pod.get("containers", []):
                      sec = c["securityContext"]
                      assert sec["allowPrivilegeEscalation"] is False, (d["metadata"]["name"], sec)
                      assert sec["capabilities"]["drop"] == ["ALL"], (d["metadata"]["name"], sec)
          app = next(d for d in docs if d["kind"] == "Deployment" and d["metadata"]["name"] == "agile-retro")
          pod = app["spec"]["template"]["spec"]
          env = {e["name"]: e.get("value") for e in pod["containers"][0]["env"]}
          assert env["AUTH_URL"] == "https://agile-retro.apps.example.com", env
          assert env["NODE_EXTRA_CA_CERTS"] == "/etc/agile-retro/ca/ca-bundle.crt", env
          volumes = {v["name"]: v for v in pod["volumes"]}
          assert volumes["extra-ca"]["configMap"]["name"] == "trusted-ca", volumes
          mounts = {m["name"]: m["mountPath"] for m in pod["containers"][0]["volumeMounts"]}
          assert mounts["extra-ca"] == "/etc/agile-retro/ca", mounts
          # No secret is ever a literal in a Deployment.
          for name in ("AUTH_SECRET", "AUTH_KEYCLOAK_SECRET"):
              entry = next(e for e in pod["containers"][0]["env"] if e["name"] == name)
              assert "value" not in entry, entry
          policy = next(d for d in docs if d["kind"] == "NetworkPolicy")
          assert any(5353 in [p["port"] for p in e.get("ports", [])] for e in policy["spec"]["egress"]), policy
          print("The OpenShift example renders as documented.")
          PY

      # The example docs/OPENSHIFT.md walks through, held to what its comments
      # say: a Route and no Ingress, the cluster's trusted CA injected into a
      # ConfigMap the chart never writes data into and mounted where Node reads
      # it, the database and client secret from Secrets, only the router let
      # in, and no fixed UIDs.
      - name: Render the company OpenShift example
        run: |
          helm lint charts/agile-retro -f deploy/examples/values-openshift.yaml
          helm template agile-retro charts/agile-retro -n agile-retro \
            -f deploy/examples/values-openshift.yaml > example.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("example.yaml")) if d]
          kinds = {d["kind"] for d in docs}
          assert "Route" in kinds and "Ingress" not in kinds, kinds
          cm = next(d for d in docs if d["kind"] == "ConfigMap" and d["metadata"]["name"] == "agile-retro-trusted-ca")
          assert cm["metadata"]["labels"]["config.openshift.io/inject-trusted-cabundle"] == "true", cm
          assert "data" not in cm, "the chart must not write data OpenShift injects"
          app = next(d for d in docs if d["kind"] == "Deployment" and d["metadata"]["name"] == "agile-retro")
          pod = app["spec"]["template"]["spec"]
          c = pod["containers"][0]
          env = {e["name"]: e for e in c["env"]}
          assert env["NODE_EXTRA_CA_CERTS"]["value"] == "/etc/agile-retro/ca/ca-bundle.crt", env["NODE_EXTRA_CA_CERTS"]
          assert {v["name"]: v for v in pod["volumes"]}["extra-ca"]["configMap"]["name"] == "agile-retro-trusted-ca"
          assert env["DATABASE_URL"]["valueFrom"]["secretKeyRef"] == {"name": "agile-retro-db", "key": "database-url"}
          assert env["AUTH_KEYCLOAK_SECRET"]["valueFrom"]["secretKeyRef"]["name"] == "agile-retro-oidc"
          assert env["AUTH_URL"]["value"] == "https://retro.apps.ocp.example.com", env["AUTH_URL"]
          assert not {"runAsUser", "runAsGroup", "fsGroup"} & set(pod["securityContext"]), pod["securityContext"]
          assert not any(d["kind"] == "Deployment" and d["metadata"]["name"].endswith("-postgres") for d in docs)
          policy = next(d for d in docs if d["kind"] == "NetworkPolicy")
          sel = policy["spec"]["ingress"][0]["from"][0]["namespaceSelector"]["matchLabels"]
          assert "policy-group.network.openshift.io/ingress" in sel, sel
          print("The company OpenShift example renders as documented.")
          PY

      # On OpenShift the bundled database runs under an arbitrary UID. Each
      # image family must get its own settings — the image's name decides —
      # and the probes must name the user, which an assigned UID cannot look
      # up in the alpine image's /etc/passwd.
      - name: Render OpenShift with the bundled database
        run: |
          python3 - <<'PY'
          import subprocess, yaml
          def postgres(*sets):
              args = ["helm", "template", "agile-retro", "charts/agile-retro", "-n", "retro", "--set", "openshift.enabled=true"]
              for s in sets: args += ["--set", s]
              docs = [d for d in yaml.safe_load_all(subprocess.check_output(args)) if d]
              pg = next(d for d in docs if d["kind"] == "Deployment" and d["metadata"]["name"].endswith("-postgres"))
              pod = pg["spec"]["template"]["spec"]
              return pod, pod["containers"][0]
          for sets, image in [((), "docker.io/library/postgres:16-alpine"),
                              (("postgresql.image=registry.example.com/mirror/postgres:16-alpine",), "registry.example.com/mirror/postgres:16-alpine")]:
              pod, c = postgres(*sets)
              assert c["image"] == image, c["image"]
              env = {e["name"]: e.get("value") for e in c["env"]}
              assert {"POSTGRES_USER", "POSTGRES_PASSWORD", "POSTGRES_DB"} <= set(env), env
              assert env["PGDATA"] == "/var/lib/postgresql/data/pgdata", env
              mounts = {m["name"]: m["mountPath"] for m in c["volumeMounts"]}
              assert mounts == {"data": "/var/lib/postgresql/data", "run": "/var/run/postgresql"}, mounts
              assert not {"runAsUser", "runAsGroup", "fsGroup"} & set(pod["securityContext"]), pod["securityContext"]
              probe = " ".join(c["livenessProbe"]["exec"]["command"])
              assert "-U " in probe and "-d " in probe, probe
          pod, c = postgres("postgresql.image=registry.redhat.io/rhel9/postgresql-16")
          env = {e["name"] for e in c["env"]}
          assert {"POSTGRESQL_USER", "POSTGRESQL_PASSWORD", "POSTGRESQL_DATABASE"} <= env, env
          assert c["volumeMounts"][0]["mountPath"] == "/var/lib/pgsql/data", c["volumeMounts"]
          print("Each image family gets its own settings on OpenShift.")
          PY

      # The probes are what a cluster restarts and routes on, so they are
      # pinned: liveness must not depend on the database, readiness must.
      - name: Render the default install
        run: |
          helm template agile-retro charts/agile-retro -n retro > default.yaml
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("default.yaml")) if d]
          app = next(d for d in docs if d["kind"] == "Deployment" and d["metadata"]["name"] == "agile-retro")
          c = app["spec"]["template"]["spec"]["containers"][0]
          assert c["startupProbe"]["httpGet"]["path"] == "/api/health", c["startupProbe"]
          assert c["livenessProbe"]["httpGet"]["path"] == "/api/health", c["livenessProbe"]
          assert c["readinessProbe"]["httpGet"]["path"] == "/api/ready", c["readinessProbe"]
          assert c["resources"]["requests"]["cpu"], c["resources"]
          ingress = next(d for d in docs if d["kind"] == "Ingress")
          port = ingress["spec"]["rules"][0]["http"]["paths"][0]["backend"]["service"]["port"]["number"]
          assert port == 3000, ingress
          # Nothing in the release calls the Kubernetes API, so no pod gets a token.
          for d in docs:
              spec = d.get("spec", {})
              pod = spec if d["kind"] == "Pod" else spec.get("template", {}).get("spec")
              if pod:
                  assert pod.get("automountServiceAccountToken") is False, (d["kind"], d["metadata"]["name"])
          # Migrations run in an init container before the app, from its own
          # image, as ShoutOut does.
          init = app["spec"]["template"]["spec"]["initContainers"]
          assert [i["name"] for i in init] == ["migrate"], init
          assert init[0]["command"] == ["node", "db/migrate.mjs"], init[0]
          assert init[0]["image"] == c["image"], (init[0]["image"], c["image"])
          assert init[0]["securityContext"]["readOnlyRootFilesystem"] is True, init[0]
          # The data, and the password that opens it, outlive `helm uninstall`.
          kept = {(d["kind"], d["metadata"]["name"]) for d in docs
                  if (d["metadata"].get("annotations") or {}).get("helm.sh/resource-policy") == "keep"}
          assert kept == {("PersistentVolumeClaim", "agile-retro-postgres"), ("Secret", "agile-retro-postgres")}, kept
          print("The default install renders as documented.")
          PY

      - name: SQLite needs no migration container
        run: |
          helm template t charts/agile-retro --set sqlite.enabled=true --set postgresql.enabled=false > sqlite.yaml
          if grep -q "initContainers" sqlite.yaml; then echo "SQLite got a migration init container"; exit 1; fi

      # Configurations that cannot work must not render at all.
      - name: Refuse impossible configurations
        run: |
          refuse() {
            if helm template t charts/agile-retro "$@" >/dev/null 2>&1; then
              echo "rendered but should not have: $*"; exit 1
            fi
          }
          # An Ingress and a Route would serve the app at two hosts, and only
          # one can match the registered OAuth callback.
          refuse --set openshift.route.enabled=true --set openshift.route.host=x.example.com
          # A CA from two places at once.
          refuse --set extraCaCerts.configMap=a --set extraCaCerts.secret=b
          # Keycloak without an issuer, and no database at all.
          refuse --set auth.keycloak.enabled=true --set auth.keycloak.clientId=x
          refuse --set postgresql.enabled=false
          # More than one replica splits every board (see scaling in values.yaml).
          refuse --set replicaCount=2
          # A conditional extraObjects item takes only when and object, and
          # when must be a boolean or a template string.
          refuse --set 'extraObjects[0].object.kind=ConfigMap' --set 'extraObjects[0].when=true' --set 'extraObjects[0].enabled=true'
          refuse --set 'extraObjects[0].object.kind=ConfigMap' --set 'extraObjects[0].when=1'
          echo "All refused."

  migrations:
    name: Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    # The runner against a real PostgreSQL, as ShoutOut's CI does: order,
    # once-only, rollback on failure, concurrent pods, building the schema
    # from nothing, and taking over a database built before migrations were
    # versioned.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run the migration tests
        env:
          PG_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run test:migrations

  audit:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails the build on high or critical. Moderate and below are reported
      # but do not block, so the gate stays credible enough to act on.
      - name: Audit dependencies
        run: npm run audit -- --level high

  image:
    name: Build, smoke-test and scan image (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # A native Arm runner rather than QEMU: a Next.js build under
            # emulation takes the better part of an hour.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      # Publish only from main (pull requests and the weekly re-scan just build,
      # test and scan), and only with credentials that can write to the
      # opentooling org.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (secrets.GHCR_TOKEN != '' || github.repository_owner == 'opentooling') }}
    outputs:
      publish: ${{ env.PUBLISH }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: agile-retro:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      # OpenShift runs the container as an arbitrary UID in group 0, never as
      # the image's own user. An image that only works as UID 1001 passes every
      # other check here and then crashes on the first OpenShift cluster it
      # meets — which is exactly what happened when a source file was 0600 —
      # so it is started the way OpenShift starts it, and asked if it is up.
      - name: Smoke-test as an arbitrary UID, the way OpenShift runs it
        run: |
          docker run -d --name smoke --user 1000650000:0 -p 3000:3000 \
            -e DATABASE_URL=file:/tmp/smoke.db \
            -e AUTH_SECRET=ci-smoke-test-only -e AUTH_URL=http://localhost:3000 \
            agile-retro:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/ready; then echo; echo "Ready as an arbitrary UID."; exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Trivy vulnerability scan (fails on fixable high/critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agile-retro:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Explain skipped publish
        if: env.PUBLISH != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "::notice::Image not published to $IMAGE_NAME. Add a GHCR_TOKEN secret (and GHCR_USERNAME variable) or move the repo to the opentooling org."
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          # GITHUB_TOKEN can only publish under this repo's owner. To publish to
          # the opentooling org from elsewhere, set the GHCR_USERNAME variable and
          # a GHCR_TOKEN secret (a token with write:packages).
          username: ${{ vars.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      # The same build, from cache, pushed by digest; the publish job joins the
      # two architectures into one image index.
      - name: Push the tested image by digest
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
      - name: Record digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image to GHCR
    if: needs.image.outputs.publish == 'true'
    # Only a commit that passed every check.
    needs: [test, e2e, chart, audit, migrations, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.short.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v4
      - name: Short tag
        id: short
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=sha,format=long,prefix=sha-
            type=raw,value=main
            type=raw,value=latest
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Create manifest list (amd64 + arm64)
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)
      - name: Show the published image
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME:${{ steps.short.outputs.tag }}"
          echo "::notice::Published $IMAGE_NAME:${{ steps.short.outputs.tag }} (also sha-$GITHUB_SHA, main, latest)"

  publish-chart:
    name: Publish Helm chart to GHCR
    # After the image, so the chart's default image tag always resolves.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      # Version: major.minor from Chart.yaml, patch = CI run number, so a plain
      # `helm install` gets the newest. appVersion — the default image tag — is
      # the image built from this commit.
      - name: Package the chart
        id: package
        run: |
          base="$(sed -n 's/^version: *\([0-9]*\.[0-9]*\)\..*/\1/p' charts/agile-retro/Chart.yaml)"
          version="$base.${{ github.run_number }}"
          helm package charts/agile-retro --version "$version" \
            --app-version "${{ needs.publish.outputs.tag }}" --destination "$RUNNER_TEMP"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Push the chart
        env:
          REGISTRY_USER: ${{ vars.GHCR_USERNAME || github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_PASSWORD" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          helm push "$RUNNER_TEMP/agile-retro-${{ steps.package.outputs.version }}.tgz" "$CHART_REGISTRY"

      # Pulled back and rendered, to prove what was published installs the
      # image published with it.
      - name: Check the published chart
        run: |
          version="${{ steps.package.outputs.version }}"
          helm show chart "$CHART_REGISTRY/agile-retro" --version "$version"
          image="$(helm template agile-retro "$CHART_REGISTRY/agile-retro" --version "$version" \
            | sed -n 's/^ *image: *//p' | tr -d '"' | sort -u | grep agile-retro)"
          echo "$image"
          test "$image" = "$IMAGE_NAME:${{ needs.publish.outputs.tag }}"
          echo "::notice::Published $CHART_REGISTRY/agile-retro $version, installing $image"
